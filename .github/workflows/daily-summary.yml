name: Daily Branch Workload Summary

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Choose branch to summarize (input "all" for all branches)'
        required: true
        type: string
        default: 'all'

jobs:
  summarize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch target branch updates and generate summary
        env:
          OPENCLAW_API_KEY: ${{ secrets.OPENCLAW_API_KEY }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch || 'all' }}
          PYTHONIOENCODING: utf-8
        run: |
          git config --local core.quotepath false
          python .github/scripts/daily_summary.py

      - name: Commit and push summary to master
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add branch_summaries/
          if git diff --staged --quiet; then
            echo "No changes to commit. Exiting safely."
            exit 0
          fi
          BRANCH_NAME="${{ github.event.inputs.target_branch || 'all' }}"
          git commit -m "docs: add summary for branch ${BRANCH_NAME} on $(date +'%Y-%m-%d')"
          git push origin master || { echo "Failed to push"; exit 1; }
