name: Daily Branch Workload Summary

on:
  # 允许手动触发执行，并且强制选择目标分支
  workflow_dispatch:
    inputs:
      target_branch:
        description: '选择需要生成总结的分支'
        required: true
        type: string
        default: 'master'

jobs:
  summarize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必须拉取所有历史记录和分支以进行对比
          ref: ${{ github.event.inputs.target_branch }} # 直接检出该分支

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 如果后续你使用 OpenAI SDK 调用 OpenClaw 等 API，可以在这就安装
          pip install requests

      - name: Fetch target branch updates and generate summary
        env:
          # 在 GitHub 仓库设置 -> Secrets and variables -> Actions 中添加 OPENCLAW_API_KEY
          OPENCLAW_API_KEY: ${{ secrets.OPENCLAW_API_KEY }} 
          TARGET_BRANCH: ${{ github.event.inputs.target_branch }}
        run: |
          python .github/scripts/daily_summary.py

      - name: Commit and push summary to master
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout master || git branch -b master
          git add branch_summaries/
          git commit -m "docs: add summary for branch ${{ github.event.inputs.target_branch }} on $(date +'%Y-%m-%d')" || echo "No changes to commit"
          # Push 确保推送到 master 分支
          git push origin master
