version: '3.8'

x-kaiwu-client:
  docker_registry: kaiwu-pub.tencentcloudcr.com
  version_path: ./code/kaiwu.json
  monitor_url: 'http://127.0.0.1:${KAIWU_MONITOR_PORT}/p/v5/exp/monitor?domain_id=1&exp_id=1&task_uuid=1&task_id=0&platform=competition_stage'
  extra:
    back_to_the_realm:
      extra_cmd: '--profile packing'
    intelligent_traffic_lights:
      extra_cmd: '--profile packing'
    back_to_the_realm_v2:
      extra_cmd: '--profile packing'
    intelligent_traffic_lights_v2:
      extra_cmd: '--profile packing'

  # # 共享环境变量
  environment: &env # KaiwuDRL 框架配置
    # 未在 .env 中定义的变量（硬编码）
    use_alloc: False
    push_to_cos: False
    use_rainbow: False
    use_prometheus: True
    prometheus_pushgateway: pushgateway:9091
    monitor_version: v2
    KAIWU_FEATURE_CONFIG: ""
    KAIWU_TRAIN_TIME: 3600
    KAIWU_RUNNING_MODE: normal
    KAIWU_REWARD_CONFIG: ""
    KAIWU_EXPERIMENT_ID: 0
    KAIWU_MONITOR_VERSION: v2
    # 在 .env 中定义的变量（从 .env 引用）
    KAIWU_PROJECT_CODE: ${KAIWU_PROJECT_CODE}
    KAIWU_PROJECT_VERSION: ${KAIWU_PROJECT_VERSION}
    KAIWU_MONITOR_PORT: ${KAIWU_MONITOR_PORT}
    KAIWU_PARALLEL_ENV_PER_AISRV: ${KAIWU_PARALLEL_ENV_PER_AISRV}
    KAIWU_AISRV_NUM: ${KAIWU_AISRV_NUM}
    KAIWU_TRAINING_MODE: ${KAIWU_TRAINING_MODE}
    KAIWU_ALGORITHM: ${KAIWU_ALGORITHM}
    KAIWU_GAMECORE_NUM: ${KAIWU_GAMECORE_NUM}
    KAIWU_AISRV_GPU1: ${KAIWU_AISRV_GPU1}
    KAIWU_AISRV_GPU2: ${KAIWU_AISRV_GPU2}
    KAIWU_AISRV_GPU3: ${KAIWU_AISRV_GPU3}
    KAIWU_AISRV_GPU1_NUM: ${KAIWU_AISRV_GPU1_NUM}
    KAIWU_AISRV_GPU2_NUM: ${KAIWU_AISRV_GPU2_NUM}
    KAIWU_AISRV_GPU3_NUM: ${KAIWU_AISRV_GPU3_NUM}
    KAIWU_TASK_ID: ${KAIWU_TASK_ID}
    KAIWU_TASK_UUID: ${KAIWU_TASK_UUID}
    KAIWU_SET_CNT: ${KAIWU_SET_CNT}
    KAIWU_SET_INDEX: ${KAIWU_SET_INDEX}
    KAIWU_DOMAIN_TYPE: ${KAIWU_DOMAIN_TYPE}
    KAIWU_PLAYER_TYPE: ${KAIWU_PLAYER_TYPE}
    KAIWU_DOMAIN_ID: ${KAIWU_DOMAIN_ID}
    KAIWU_PLAYER_ID: ${KAIWU_PLAYER_ID}
    KAIWU_PUBLIC_KEY: ${KAIWU_PUBLIC_KEY}
    KAIWU_PYTORCH_READ_DATA_FROM_REVERB_TYPE: ${KAIWU_PYTORCH_READ_DATA_FROM_REVERB_TYPE}
    KAIWU_EXPERIMENT_TRAIN_BATCH_SIZE: ${KAIWU_EXPERIMENT_TRAIN_BATCH_SIZE}
    KAIWU_EXPERIMENT_DUMP_MODEL_FREQ: ${KAIWU_EXPERIMENT_DUMP_MODEL_FREQ}
    KAIWU_EXPERIMENT_REPLAY_BUFFER_CACHE_MULTIPLIER: ${KAIWU_EXPERIMENT_REPLAY_BUFFER_CACHE_MULTIPLIER}
    KAIWU_EXPERIMENT_REVERB_RATE_LIMITER: ${KAIWU_EXPERIMENT_REVERB_RATE_LIMITER}
    KAIWU_EXPERIMENT_REVERB_SAMPLER: ${KAIWU_EXPERIMENT_REVERB_SAMPLER}
    KAIWU_EXPERIMENT_SEND_SAMPLE_SIZE: ${KAIWU_EXPERIMENT_SEND_SAMPLE_SIZE}
    KAIWU_PERF_STAT_WINDOW_SECONDS: ${KAIWU_PERF_STAT_WINDOW_SECONDS}
    KAIWU_EXPERIMENT_REPLAY_BUFFER_TYPE: ${KAIWU_EXPERIMENT_REPLAY_BUFFER_TYPE}
    KAIWU_EXPERIMENT_PREDICT_BATCH_SIZE: ${KAIWU_EXPERIMENT_PREDICT_BATCH_SIZE}
    KAIWU_BENCHMARK_MODE: ${KAIWU_BENCHMARK_MODE:-}
    KAIWU_BENCHMARK_CHECKPOINT: ${KAIWU_BENCHMARK_CHECKPOINT:-}

services:
  # ==================== Learner 学习器 ====================
  learner:
    image: 'kaiwu-pub.tencentcloudcr.com/project/${KAIWU_PROJECT_CODE}/edu/win_gpu:${KAIWU_PROJECT_VERSION}'
    volumes:
      - '${KAIWU_BACKUP_MODEL}:/workspace/train/backup_model'
      - shared_volume_train:/workspace/train
      - '${KAIWU_TRAIN_LOG}:/workspace/log'
      - '${KAIWU_CODE_FILE}:/workspace/code'
      # Persist framework checkpoints to host (KaiwuDRL saves here)
      - '${KAIWU_TRAIN_LOG}/framework_ckpt:/data/user_ckpt_dir'
      # Archive directory for experiment tracking
      - '${KAIWU_ARCHIVE_DIR}:/workspace/archive'
    environment:
      <<: *env
      KAIWU_SERVICE_NAME: learner
      KAIWU_PYTORCH_UPGRADE: ${KAIWU_PYTORCH_UPGRADE:-0}
      NVIDIA_VISIBLE_DEVICES: ${KAIWU_LEARNER_GPU}
      CUDA_VISIBLE_DEVICES: ${KAIWU_LEARNER_GPU}
    labels:
      - 'kaiwu=train-check'
    depends_on:
      - backup_model
      - pushgateway
      - gamecore
    command:
      - bash
      - '-lc'
      - |
        set -euo pipefail
        echo "[learner-runtime] cuda_visible_devices=$${CUDA_VISIBLE_DEVICES:-unset} replay_buffer_type=${KAIWU_EXPERIMENT_REPLAY_BUFFER_TYPE:-reverb} pytorch_read_data_from_reverb_type=${KAIWU_PYTORCH_READ_DATA_FROM_REVERB_TYPE:-unset} predict_batch_size=${KAIWU_EXPERIMENT_PREDICT_BATCH_SIZE:-unset} train_batch_size=${KAIWU_EXPERIMENT_TRAIN_BATCH_SIZE:-unset} send_sample_size=${KAIWU_EXPERIMENT_SEND_SAMPLE_SIZE:-unset}"
        python3 - <<'PY'
        from pathlib import Path
        import os
        import re
        import sys

        project = os.environ.get("KAIWU_PROJECT_CODE", "robot_vacuum")
        root = Path(f"/data/projects/{project}")
        workspace_code = Path("/workspace/code")
        sys.path.insert(0, str(workspace_code))

        from agent_ppo.utils.zmq_patch import patch_zmq_runtime_files

        def format_toml_value(value):
            if value.lower() in {"true", "false"}:
                return value.lower()
            try:
                int(value)
                return value
            except ValueError:
                return f'"{value}"'

        def replace_toml_key(target, key, env_name):
            env_value = os.environ.get(env_name)
            if env_value in (None, ""):
                return
            text = target.read_text()
            lines = text.splitlines()
            replacement = f"{key} = {format_toml_value(env_value)}"
            filtered = [line for line in lines if line.strip().split("=", 1)[0].strip() != key]
            updated = "\n".join(filtered)
            if updated:
                updated = f"{updated}\n{replacement}\n"
            else:
                updated = f"{replacement}\n"
            if updated != text:
                target.write_text(updated)

        patched_zmq_targets = patch_zmq_runtime_files(root, os.environ.get("KAIWU_EXPERIMENT_REPLAY_BUFFER_TYPE"))
        for patched_target in patched_zmq_targets:
            print(f"[learner-zmq] forced spawn multiprocessing context in {patched_target}")

        for relative in (
            "kaiwudrl/common/utils/mem_buffer.py",
            "kaiwudrl/common/utils/mem_buffer_ratio.py",
        ):
            target = root / relative
            if not target.exists():
                continue
            text = target.read_text()
            original = text
            text = text.replace(
                "        self.device = \"cpu\"\n        if torch.cuda.is_available():\n            self.device = \"cuda\"\n",
                "        # Linux ZMQ: avoid touching CUDA in the parent learner process before fork.\n        # Trainer moves tensors/models to CUDA explicitly later.\n        self.device = \"cpu\"\n",
                1,
            )
            text = text.replace(
                '        self.device = "cuda" if torch.cuda.is_available() else "cpu"\n',
                '        # Linux ZMQ: avoid touching CUDA in the parent learner process before fork.\n        # Trainer moves tensors/models to CUDA explicitly later.\n        self.device = "cpu"\n',
                1,
            )
            if text != original:
                target.write_text(text)
                print(f"[learner-zmq] forced CPU-only mem_buffer device init in {target}")

        monitor_target = root / "common_python/monitor/monitor_manager.py"
        text = monitor_target.read_text()
        queue_marker = '_shared_queue = multiprocessing.Queue(CONFIG.queue_size)'
        if queue_marker not in text:
            if "import sys\n" not in text:
                text = text.replace("import multiprocessing\n", "import multiprocessing\nimport sys\n", 1)
            if "from common_python.config.config_control import CONFIG\n" not in text:
                text = text.replace(
                    "from common_python.logging.kaiwu_logger import KaiwuLogger\n",
                    "from common_python.logging.kaiwu_logger import KaiwuLogger\nfrom common_python.config.config_control import CONFIG\n",
                    1,
                )
            old = "\n".join([
                "def _get_shared_queue():",
                '    """延迟创建共享队列（避免 fork 后的连接问题）"""',
                "    global _manager, _shared_queue",
                "    if _shared_queue is None:",
                "        _manager = multiprocessing.Manager()",
                "        _shared_queue = _manager.Queue()",
                "    return _shared_queue",
                "",
            ])
            new = "\n".join([
                "def _get_shared_queue():",
                '    """延迟创建共享队列。Linux 独立训练优先使用原生 Queue，避免 Manager socket 断连。"""',
                "    global _manager, _shared_queue",
                "    if _shared_queue is None:",
                '        if sys.platform.startswith("linux"):',
                "            _shared_queue = multiprocessing.Queue(CONFIG.queue_size)",
                "        else:",
                "            _manager = multiprocessing.Manager()",
                "            _shared_queue = _manager.Queue()",
                "    return _shared_queue",
                "",
            ])
            if old not in text:
                raise SystemExit(f"Failed to patch {monitor_target}: queue function anchor not found")
            text = text.replace(old, new, 1)
            monitor_target.write_text(text)

        model_file_common_target = root / "kaiwudrl/common/checkpoint/model_file_common.py"
        text = model_file_common_target.read_text()
        clear_user_marker = "for entry in os.listdir(model_path):"
        if clear_user_marker not in text:
            old = "\n".join([
                "def clear_user_ckpt_dir():",
                '    """',
                "    清空/data/user_ckpt/下的文件夹内容, 在进程启动时进行操作",
                "    为软链接时不做操作",
                '    """',
                "    model_path = CONFIG.user_ckpt_dir",
                "    if os.path.islink(model_path):",
                "        return",
                "",
                "    if os.path.exists(model_path):",
                "        shutil.rmtree(model_path)",
                "",
            ])
            new = "\n".join([
                "def clear_user_ckpt_dir():",
                '    """',
                "    清空/data/user_ckpt/下的文件夹内容, 在进程启动时进行操作",
                "    为软链接时不做操作",
                '    """',
                "    model_path = CONFIG.user_ckpt_dir",
                "    if os.path.islink(model_path):",
                "        return",
                "",
                "    if not os.path.exists(model_path):",
                "        return",
                "",
                "    # Linux 独立部署中该路径通常是挂载根目录，不能直接 rmtree 根挂载点。",
                "    for entry in os.listdir(model_path):",
                "        entry_path = os.path.join(model_path, entry)",
                "        try:",
                "            if os.path.islink(entry_path) or os.path.isfile(entry_path):",
                "                os.remove(entry_path)",
                "            elif os.path.isdir(entry_path):",
                "                shutil.rmtree(entry_path)",
                "        except FileNotFoundError:",
                "            continue",
                "",
            ])
            if old not in text:
                raise SystemExit(f"Failed to patch {model_file_common_target}: clear_user_ckpt_dir anchor not found")
            text = text.replace(old, new, 1)
            model_file_common_target.write_text(text)

        # Model signer V2 lives in the mounted code directory (code/agent_ppo/utils/model_signer.py).
        # It processes tar.gz files created by after_save_model() into signed zips.
        # V1 injection removed — the file is maintained in the repo and auto-mounted.
        signer_path = Path("/workspace/code/agent_ppo/utils/model_signer.py")
        if not signer_path.exists():
            raise SystemExit(f"Model signer not found at {signer_path}")
        signer_marker = "# MODEL_SIGNER_V2"
        signer_text = signer_path.read_text()
        if signer_marker not in signer_text:
            raise SystemExit(f"Model signer at {signer_path} is not V2, expected {signer_marker}")

        # Patch trainer.py: use ModelSignerThread instead of skipping model_file_saver
        trainer_target = root / "kaiwudrl/server/learner/trainer.py"
        text = trainer_target.read_text()
        trainer_marker = 'self.logger.info("train skip model_file_saver process because push_to_cos is disabled")'
        if trainer_marker not in text:
            import_line = "from agent_ppo.utils.model_signer import ModelSignerThread\n"
            if "ModelSignerThread" not in text:
                text = text.replace(
                    "from common_python.worker.worker import Worker, WorkerConfig\n",
                    "from common_python.worker.worker import Worker, WorkerConfig\n" + import_line,
                )
            old = "\n".join([
                "        if self.agent_wrapper.is_chief:",
                "            # model_file_saver, 用于保存模型文件到持久化设备, 比如COS, 采用单独的进程处理, 只有主learner进程才会执行",
                "            self.model_file_saver = ModelFileSave()",
                "            self.model_file_saver.start()",
                "",
            ])
            new = "\n".join([
                "        self.model_file_saver = None",
                "        if self.agent_wrapper.is_chief:",
                "            # Linux: threading-based signer replaces fork-based ModelFileSave",
                "            self.model_file_saver = ModelSignerThread(self.logger)",
                "            self.model_file_saver.start()",
                "",
            ])
            if old not in text:
                raise SystemExit(f"Failed to patch {trainer_target}: model_file_saver anchor not found")
            text = text.replace(old, new, 1)
            trainer_target.write_text(text)

        debug_marker = 'self.logger.info("train debug milestone after_alloc_utils")'
        if debug_marker not in text:
            replacements = [
                (
                    "        # 业务算法类监控值是个map形式\n        self.app_monitor_data = {}\n",
                    "        # 业务算法类监控值是个map形式\n        self.app_monitor_data = {}\n        self.logger.info(\"train debug milestone after_monitor_state_reset\")\n",
                ),
                (
                    "        self.alloc_util = AllocUtils(self.logger)\n",
                    "        self.alloc_util = AllocUtils(self.logger)\n        self.logger.info(\"train debug milestone after_alloc_utils\")\n",
                ),
                (
                    "        t.start()\n",
                    "        t.start()\n        self.logger.info(\"train debug milestone after_aisrv_thread_start\")\n",
                ),
                (
                    "            register_sigterm_handler(self.handle_sigterm, CONFIG.sigterm_pids_file)\n",
                    "            register_sigterm_handler(self.handle_sigterm, CONFIG.sigterm_pids_file)\n            self.logger.info(\"train debug milestone after_register_sigterm\")\n",
                ),
                (
                    "        if self.agent_wrapper.is_chief:\n            # 策略特定的初始化\n            self.strategy.before_run()\n",
                    "        if self.agent_wrapper.is_chief:\n            # 策略特定的初始化\n            self.logger.info(\"train debug milestone before_strategy_before_run\")\n            self.strategy.before_run()\n            self.logger.info(\"train debug milestone after_strategy_before_run\")\n",
                ),
            ]
            for old, new in replacements:
                if old not in text:
                    raise SystemExit(f"Failed to patch {trainer_target}: debug anchor not found for {old!r}")
                text = text.replace(old, new, 1)
            trainer_target.write_text(text)

        text = trainer_target.read_text()
        spawn_safe_trainer_marker = "spawn-safe init avoids pickling KaiwuLogger and ReplayBufferWrapper"
        if spawn_safe_trainer_marker not in text:
            old = "\n".join([
                "        # 注意: logger的set_logger_format在before_run中调用(子进程中执行)",
                "        # 避免在主进程中添加handler导致日志写入多个文件",
                "        self.logger = KaiwuLogger()",
                "",
                "        self.cached_local_step = -1",
                "",
                "        self.local_step = Value(\"d\", -1)",
                "",
                "        # policy和agent_wrapper对象的map, 为了支持多agent",
                "        self.policy_agent_wrapper_maps = {}",
                "",
                "        # tensorflow需要传递下面的三个参数",
                "        self.tensor_names = self.get_tensor_names()",
                "        self.tensor_dtypes = self.get_tensor_dtypes()",
                "",
                "        # replay_buffer",
                "        self.replay_buffer_wrapper = ReplayBufferWrapper(self.tensor_names, self.tensor_dtypes, self.logger)",
                "",
                "        # 通过组合引入策略",
                "        self.strategy = create_strategy(self)",
            ])
            new = "\n".join([
                "        # spawn-safe init avoids pickling KaiwuLogger and ReplayBufferWrapper",
                "        # logger的set_logger_format在before_run中调用(子进程中执行)",
                "        self.logger = None",
                "",
                "        self.cached_local_step = -1",
                "",
                "        self.local_step = Value(\"d\", -1)",
                "",
                "        # policy和agent_wrapper对象的map, 为了支持多agent",
                "        self.policy_agent_wrapper_maps = {}",
                "",
                "        # tensorflow需要传递下面的三个参数",
                "        self.tensor_names = self.get_tensor_names()",
                "        self.tensor_dtypes = self.get_tensor_dtypes()",
                "",
                "        # replay_buffer 与 strategy 在子进程 before_run 中初始化，避免 spawn pickling 失败",
                "        self.replay_buffer_wrapper = None",
                "",
                "        # 通过组合引入策略",
                "        self.strategy = None",
            ])
            if old not in text:
                raise SystemExit(f"Failed to patch {trainer_target}: spawn-safe __init__ anchor not found")
            text = text.replace(old, new, 1)

            old = "\n".join([
                "    def before_run(self):",
                "",
                "        # 在子进程中初始化logger, 避免在主进程中添加handler导致日志写入多个文件",
                "        self.current_pid = os.getpid()",
                "        self.logger.set_logger_format(",
            ])
            new = "\n".join([
                "    def before_run(self):",
                "",
                "        # 在子进程中初始化运行态对象，避免 spawn 时 pickling 失败",
                "        if self.logger is None:",
                "            self.logger = KaiwuLogger()",
                "        if self.replay_buffer_wrapper is None:",
                "            self.replay_buffer_wrapper = ReplayBufferWrapper(self.tensor_names, self.tensor_dtypes, self.logger)",
                "        if self.strategy is None:",
                "            self.strategy = create_strategy(self)",
                "        if self.shared_mem_buffer is not None and hasattr(self.shared_mem_buffer, \"set_logger\"):",
                "            self.shared_mem_buffer.set_logger(self.logger)",
                "",
                "        # 在子进程中初始化logger, 避免在主进程中添加handler导致日志写入多个文件",
                "        self.current_pid = os.getpid()",
                "        self.logger.set_logger_format(",
            ])
            if old not in text:
                raise SystemExit(f"Failed to patch {trainer_target}: before_run spawn-safe anchor not found")
            text = text.replace(old, new, 1)
            trainer_target.write_text(text)

        learner_target = root / "kaiwudrl/server/learner/learner.py"
        text = learner_target.read_text()
        shared_buffer_spawn_marker = "shared_mem_buffer.set_logger(None)"
        if shared_buffer_spawn_marker not in text:
            old = "\n".join([
                "    # 创建 Trainer，传入共享的 mem_buffer",
                "    train = Trainer(shared_mem_buffer)",
            ])
            new = "\n".join([
                "    if shared_mem_buffer is not None and hasattr(shared_mem_buffer, \"set_logger\"):",
                "        shared_mem_buffer.set_logger(None)",
                "",
                "    # 创建 Trainer，传入共享的 mem_buffer",
                "    train = Trainer(shared_mem_buffer)",
            ])
            if old not in text:
                raise SystemExit(f"Failed to patch {learner_target}: shared_mem_buffer anchor not found")
            text = text.replace(old, new, 1)
            learner_target.write_text(text)

        learner_server_target = root / "kaiwudrl/server/learner/learner_server.py"
        text = learner_server_target.read_text()
        learner_server_spawn_marker = 'if hasattr(self.shared_mem_buffer, "set_logger"):'
        learner_server_spawn_anchor = "        # 在子进程中创建 replay_buffer_wrapper，使用共享的 mem_buffer\n        if self.shared_mem_buffer is not None:\n"
        learner_server_spawn_injection = "        # 在子进程中创建 replay_buffer_wrapper，使用共享的 mem_buffer\n        if self.shared_mem_buffer is not None:\n            if hasattr(self.shared_mem_buffer, \"set_logger\"):\n                self.shared_mem_buffer.set_logger(self.logger)\n"
        if learner_server_spawn_marker not in text:
            if learner_server_spawn_anchor not in text:
                raise SystemExit(f"Failed to patch {learner_server_target}: shared_mem_buffer restore anchor not found")
            text = text.replace(learner_server_spawn_anchor, learner_server_spawn_injection, 1)
            learner_server_target.write_text(text)

        off_policy_target = root / "kaiwudrl/server/learner/off_policy_strategy.py"
        text = off_policy_target.read_text()
        if "from kaiwudrl.common.checkpoint.model_file_sync import ModelFileSync\n" not in text:
            text = text.replace(
                "from kaiwudrl.common.checkpoint.model_file_sync_wrapper import ModelFileSyncWrapper\n",
                "from kaiwudrl.common.checkpoint.model_file_sync_wrapper import ModelFileSyncWrapper\nfrom kaiwudrl.common.checkpoint.model_file_sync import ModelFileSync\n",
                1,
            )
        before_run_marker = "# Linux 独立训练中避免在 reverb/TF 线程启动后再 fork 同步进程。"
        if before_run_marker not in text:
            old = "\n".join([
                "        if CONFIG.wrapper_type == KaiwuDRLDefine.WRAPPER_REMOTE:",
                "            self.trainer.model_file_sync_wrapper = ModelFileSyncWrapper()",
                "            self.trainer.model_file_sync_wrapper.init()",
                "",
                "            # 只有在训练时才进行",
                "            if CONFIG.run_mode == KaiwuDRLDefine.RUN_MODE_TRAIN:",
                "                # off-policy场景下, 训练进程主动推送下第一个model文件到modelpool, 预加载和非预加载情况下都适合",
                "                push_model_success = (",
                "                    self.trainer.model_file_sync_wrapper.ckpt_sync_warper.push_checkpoint_to_model_pool(",
                "                        self.trainer.logger",
                "                    )",
                "                )",
                "                if push_model_success:",
                '                    self.trainer.logger.info(f"train first model file push to modelpool success")',
                "                else:",
                '                    self.trainer.logger.error(f"train first model file push to modelpool failed")',
                "",
            ])
            new = "\n".join([
                "        if CONFIG.wrapper_type == KaiwuDRLDefine.WRAPPER_REMOTE:",
                "            self.trainer.model_file_sync_wrapper = ModelFileSyncWrapper()",
                "            # Linux 独立训练中避免在 reverb/TF 线程启动后再 fork 同步进程。",
                "            self.trainer.model_file_sync_wrapper.ckpt_sync_warper = ModelFileSync()",
                "",
                "            # 只有在训练时才进行",
                "            if CONFIG.run_mode == KaiwuDRLDefine.RUN_MODE_TRAIN:",
                "                # off-policy场景下, 训练进程主动推送下第一个model文件到modelpool, 预加载和非预加载情况下都适合",
                "                push_model_success = (",
                "                    self.trainer.model_file_sync_wrapper.ckpt_sync_warper.push_checkpoint_to_model_pool(",
                "                        self.trainer.logger",
                "                    )",
                "                )",
                "                if push_model_success:",
                '                    self.trainer.logger.info(f"train first model file push to modelpool success")',
                "                else:",
                '                    self.trainer.logger.error(f"train first model file push to modelpool failed")',
                "",
            ])
            if old not in text:
                raise SystemExit(f"Failed to patch {off_policy_target}: before_run anchor not found")
            text = text.replace(old, new, 1)

        process_marker = 'self.trainer.logger.info(f"train push checkpoint {model_file_id} to modelpool success")'
        if process_marker not in text:
            old = "\n".join([
                "    def process_policy_specific(self, model_file_id):",
                '        """',
                "        OffPolicy不需要特殊处理",
                '        """',
                "        pass",
                "",
            ])
            new = "\n".join([
                "    def process_policy_specific(self, model_file_id):",
                '        """',
                "        OffPolicy 在独立训练模式下直接同步新模型到 modelpool，避免额外 fork。",
                '        """',
                '        sync_wrapper = getattr(self.trainer, "model_file_sync_wrapper", None)',
                '        sync_worker = getattr(sync_wrapper, "ckpt_sync_warper", None)',
                "        if sync_worker is None:",
                "            return",
                "",
                "        push_model_success = sync_worker.push_checkpoint_to_model_pool(self.trainer.logger)",
                "        if push_model_success:",
                '            self.trainer.logger.info(f"train push checkpoint {model_file_id} to modelpool success")',
                "        else:",
                '            self.trainer.logger.error(f"train push checkpoint {model_file_id} to modelpool failed")',
                "",
            ])
            if old not in text:
                raise SystemExit(f"Failed to patch {off_policy_target}: process_policy_specific anchor not found")
            text = text.replace(old, new, 1)

        cleanup_marker = 'model_file_saver = getattr(self.trainer, "model_file_saver", None)'
        if cleanup_marker not in text:
            old = "\n".join([
                "    def cleanup(self):",
                '        """',
                "        OffPolicy清理操作",
                '        """',
                "        # 非on-policy的才需要主动关闭self.model_file_sync_wrapper",
                "        self.trainer.model_file_saver.stop()",
                '        self.trainer.logger.info("train self.agent_wrapper.close success")',
                "",
                "        self.trainer.model_file_sync_wrapper.stop()",
                '        self.trainer.logger.info("train self.model_file_sync_wrapper.stop success")',
                "",
            ])
            new = "\n".join([
                "    def cleanup(self):",
                '        """',
                "        OffPolicy清理操作",
                '        """',
                '        model_file_saver = getattr(self.trainer, "model_file_saver", None)',
                '        if model_file_saver is not None and model_file_saver.is_alive():',
                "            model_file_saver.stop()",
                '            self.trainer.logger.info("train self.agent_wrapper.close success")',
                "",
                '        sync_wrapper = getattr(self.trainer, "model_file_sync_wrapper", None)',
                '        sync_worker = getattr(sync_wrapper, "ckpt_sync_warper", None)',
                '        if sync_worker is not None and sync_worker.is_alive():',
                "            sync_worker.stop()",
                '            self.trainer.logger.info("train self.model_file_sync_wrapper.stop success")',
                "",
            ])
            if old not in text:
                raise SystemExit(f"Failed to patch {off_policy_target}: cleanup anchor not found")
            text = text.replace(old, new, 1)
        off_policy_target.write_text(text)

        reverb_dataset_target = root / "kaiwudrl/common/replay_buffer/reverb_dataset_v1.py"
        text = reverb_dataset_target.read_text()
        fill_marker = "target_fill=0.10"
        if fill_marker not in text:
            text = text.replace("target_fill=0.75", "target_fill=0.10", 1)
            reverb_dataset_target.write_text(text)

        mt_marker = "_fill_worker"
        if mt_marker not in text:
            n_workers = int(os.environ.get("KAIWU_EXPERIMENT_FILL_THREADS", "3"))
            # 1. Add _fill_worker method before _fill_buffers_loop
            worker_method = (
                '    def _fill_worker(self):\n'
                '        """Parallel fill worker: fetch from reverb into backup_buffer"""\n'
                '        while not self._stop_event.is_set():\n'
                '            try:\n'
                '                data = self.client.sample(table=self._table_names[0], num_samples=CONFIG.train_batch_size)\n'
                '                if data:\n'
                '                    self.backup_buffer.extend(data)\n'
                '                else:\n'
                '                    time.sleep(CONFIG.idle_sleep_second)\n'
                '            except Exception as e:\n'
                '                self.logger.error(f"fill worker error: {e}")\n'
                '                time.sleep(CONFIG.idle_sleep_second)\n\n'
            )
            text = text.replace('    def _fill_buffers_loop(self):', worker_method + '    def _fill_buffers_loop(self):')
            # 2. Replace _fill_buffers_loop body: coordinator that swaps buffers
            old_loop = (
                '        """后台线程持续填充缓冲区"""\n\n'
                '        while not self._stop_event.is_set():\n'
                '            # 填充备用缓冲区\n'
                '            self._fill_buffer(self.backup_buffer, target_fill=0.10)\n\n'
                '            # 交换缓冲区（原子操作）\n'
                '            with self.write_lock:\n'
                '                if len(self.active_buffer) < CONFIG.train_batch_size:\n'
                '                    self.active_buffer, self.backup_buffer = self.backup_buffer, self.active_buffer\n'
                '                    self.backup_buffer.clear()\n\n'
                '            # 避免高频切换\n'
                '            time.sleep(CONFIG.idle_sleep_second)'
            )
            new_loop = (
                '        """Coordinator: swap buffers when active is low and backup has enough"""\n'
                '        while not self._stop_event.is_set():\n'
                '            time.sleep(0.3)\n'
                '            with self.write_lock:\n'
                '                if len(self.active_buffer) < CONFIG.train_batch_size and len(self.backup_buffer) >= CONFIG.train_batch_size:\n'
                '                    self.active_buffer, self.backup_buffer = self.backup_buffer, self.active_buffer\n'
                '                    self.backup_buffer.clear()'
            )
            text = text.replace(old_loop, new_loop)
            # 3. Replace start_background_filler to launch N workers + 1 coordinator
            old_start_method = (
                '    def start_background_filler(self):\n'
                '        """启动后台填充线程"""\n'
                '        if self._fill_thread is None:\n'
                '            self._stop_event.clear()\n\n'
                '            self.client = reverb.Client(f"localhost:{CONFIG.reverb_svr_port}")\n'
                '            self._fill_thread = threading.Thread(target=self._fill_buffers_loop, daemon=True)\n'
                '            self._fill_thread.start()\n'
                '            self.logger.info(\n'
                '                f"start_background_filler success, reverb.Client connect at localhost:{CONFIG.reverb_svr_port}"\n'
                '            )'
            )
            new_start_method = (
                '    def start_background_filler(self):\n'
                '        """启动多线程并行填充"""\n'
                '        if self._fill_thread is None:\n'
                '            self._stop_event.clear()\n'
                '            self.client = reverb.Client(f"localhost:{CONFIG.reverb_svr_port}")\n'
                '            self._fill_workers = []\n'
                f'            for _ in range({n_workers}):\n'
                '                t = threading.Thread(target=self._fill_worker, daemon=True)\n'
                '                t.start()\n'
                '                self._fill_workers.append(t)\n'
                '            self._fill_thread = threading.Thread(target=self._fill_buffers_loop, daemon=True)\n'
                '            self._fill_thread.start()\n'
                '            self.logger.info(f"MT fill started: {len(self._fill_workers)} workers + 1 coordinator")'
            )
            text = text.replace(old_start_method, new_start_method)
            reverb_dataset_target.write_text(text)

        learner_conf_target = root / "kaiwudrl/conf/kaiwudrl/learner.toml"
        replace_toml_key(
            learner_conf_target,
            "pytorch_read_data_from_reverb_type",
            "KAIWU_PYTORCH_READ_DATA_FROM_REVERB_TYPE",
        )
        replace_toml_key(
            learner_conf_target,
            "replay_buffer_cache_multiplier",
            "KAIWU_EXPERIMENT_REPLAY_BUFFER_CACHE_MULTIPLIER",
        )
        replace_toml_key(
            learner_conf_target,
            "reverb_num_workers_per_iterator",
            "KAIWU_REVERB_NUM_WORKERS_PER_ITERATOR",
        )

        # ---- Phase 2: Patch configure.toml for predict_batch_size ----
        configure_toml = root / "kaiwudrl/conf/kaiwudrl/configure.toml"
        replace_toml_key(configure_toml, "predict_batch_size", "KAIWU_EXPERIMENT_PREDICT_BATCH_SIZE")
        replace_toml_key(configure_toml, "proxy_batch_size", "KAIWU_EXPERIMENT_PREDICT_BATCH_SIZE")

        # Write post-init patcher that runs AFTER start_train_client.sh
        # (init_code.sh in start_train_client.sh copies code/conf/ over project conf/,
        #  overwriting any patches applied before it)
        import tempfile
        patcher = root / "kaiwudrl/post_init_patch.py"
        patcher.write_text(
            "import os, sys\n"
            "from pathlib import Path\n"
            "\n"
            "def format_toml_value(value):\n"
            "    try:\n"
            "        int(value)\n"
            "        return value\n"
            "    except ValueError:\n"
            "        return f'\"{value}\"'\n"
            "\n"
            "def replace_toml_key(target, key, env_name):\n"
            "    env_value = os.environ.get(env_name)\n"
            "    if env_value in (None, ''):\n"
            "        return\n"
            "    text = target.read_text()\n"
            "    lines = text.splitlines()\n"
            "    replacement = f'{key} = {format_toml_value(env_value)}'\n"
            "    filtered = [line for line in lines if line.strip().split('=', 1)[0].strip() != key]\n"
            "    updated = '\\n'.join(filtered)\n"
            "    if updated:\n"
            "        updated = f'{updated}\\n{replacement}\\n'\n"
            "    else:\n"
            "        updated = f'{replacement}\\n'\n"
            "    if updated != text:\n"
            "        target.write_text(updated)\n"
            "        print(f'[post-init] {key} = {env_value}')\n"
            "\n"
            "project = os.environ.get('KAIWU_PROJECT_CODE', 'robot_vacuum')\n"
            "root = Path(f'/data/projects/{project}')\n"
            "app_conf = root / 'conf/configure_app.toml'\n"
            "learner_conf = root / 'kaiwudrl/conf/kaiwudrl/learner.toml'\n"
            "\n"
            "replace_toml_key(learner_conf, 'pytorch_read_data_from_reverb_type', 'KAIWU_PYTORCH_READ_DATA_FROM_REVERB_TYPE')\n"
            "replace_toml_key(learner_conf, 'replay_buffer_cache_multiplier', 'KAIWU_EXPERIMENT_REPLAY_BUFFER_CACHE_MULTIPLIER')\n"
            "replace_toml_key(learner_conf, 'reverb_num_workers_per_iterator', 'KAIWU_REVERB_NUM_WORKERS_PER_ITERATOR')\n"
            "replace_toml_key(app_conf, 'replay_buffer_type', 'KAIWU_EXPERIMENT_REPLAY_BUFFER_TYPE')\n"
            "replace_toml_key(app_conf, 'train_batch_size', 'KAIWU_EXPERIMENT_TRAIN_BATCH_SIZE')\n"
            "replace_toml_key(app_conf, 'dump_model_freq', 'KAIWU_EXPERIMENT_DUMP_MODEL_FREQ')\n"
            "replace_toml_key(app_conf, 'reverb_rate_limiter', 'KAIWU_EXPERIMENT_REVERB_RATE_LIMITER')\n"
            "replace_toml_key(app_conf, 'reverb_sampler', 'KAIWU_EXPERIMENT_REVERB_SAMPLER')\n"
            "replace_toml_key(app_conf, 'send_sample_size', 'KAIWU_EXPERIMENT_SEND_SAMPLE_SIZE')\n"
            "\n"
            "# Patch monitor_builder: panel names cannot contain parentheses\n"
            "mb = root / 'agent_ppo/conf/monitor_builder.py'\n"
            "mb_text = mb.read_text()\n"
            "mb_text = mb_text.replace('name=\"CPS (WIN)\"', 'name=\"CPS WIN\"')\n"
            "mb_text = mb_text.replace('name=\"Avg Charge Count (WIN)\"', 'name=\"Avg Charge Count WIN\"')\n"
            "mb.write_text(mb_text)\n"
            "print(f'[post-init] Patched monitor_builder panel names')\n"
        )
        print(f"Wrote post-init patcher to {patcher}")
        PY
        if [ -n "${KAIWU_EXPERIMENT_REPLAY_BUFFER_TYPE:-}" ]; then
          sed -i "s|sh tools/change_sample_server.sh reverb|sh tools/change_sample_server.sh ${KAIWU_EXPERIMENT_REPLAY_BUFFER_TYPE}|g" /root/tools/common.sh
          echo "[learner-sed] Patched common.sh to use ${KAIWU_EXPERIMENT_REPLAY_BUFFER_TYPE}"
        fi
        COORD_SLEEP="${KAIWU_EXPERIMENT_COORDINATOR_SLEEP:-}"
        if [ -n "$$COORD_SLEEP" ]; then
          V1_FILE="/data/projects/robot_vacuum/kaiwudrl/common/replay_buffer/reverb_dataset_v1.py"
          sed -i "s/time\.sleep(0\.3)/time.sleep($${COORD_SLEEP})/" "$$V1_FILE"
          echo "[learner-sed] Patched V1 coordinator sleep to $${COORD_SLEEP}s"
        fi
        FILL_WORKERS="${KAIWU_EXPERIMENT_FILL_WORKERS:-}"
        if [ -n "$$FILL_WORKERS" ]; then
          V1_FILE="/data/projects/robot_vacuum/kaiwudrl/common/replay_buffer/reverb_dataset_v1.py"
          sed -i "s/for _ in range(3):/for _ in range($${FILL_WORKERS}):/" "$$V1_FILE"
          echo "[learner-sed] Patched V1 fill workers to $${FILL_WORKERS}"
        fi
        FILL_FETCH="${KAIWU_EXPERIMENT_FILL_FETCH_SIZE:-}"
        if [ -n "$$FILL_FETCH" ]; then
          V1_FILE="/data/projects/robot_vacuum/kaiwudrl/common/replay_buffer/reverb_dataset_v1.py"
          sed -i "s/num_samples=CONFIG.train_batch_size)/num_samples=$${FILL_FETCH})/" "$$V1_FILE"
          echo "[learner-sed] Patched V1 fill fetch size to $${FILL_FETCH}"
        fi
        V1_OPT="/workspace/code/reverb_dataset_v1_optimized.py"
        if [ -f "$$V1_OPT" ]; then
          cp "$$V1_OPT" /data/projects/robot_vacuum/kaiwudrl/common/replay_buffer/reverb_dataset_v1.py
          echo "[learner-cp] Replaced V1 with optimized version (MT-fill + pin_memory + fixed locking)"
        fi
        # Hot-patch mem_buffer: replace per-slot Value(lock=True) with lock-free Array + single Lock
        # Original: N Value(lock=True) = N semaphores (exceeds SEMMNI=32000 when N>10000)
        # Patched:  1 Array(lock=False) + 1 Lock = 1 semaphore total
        MEMBUF="/data/projects/robot_vacuum/kaiwudrl/common/utils/mem_buffer.py"
        if [ -f "$$MEMBUF" ] && ! grep -q "lock_free_data_status" "$$MEMBUF"; then
        python3 - <<'MEMBUFPY'
        import re
        membuf = "/data/projects/robot_vacuum/kaiwudrl/common/utils/mem_buffer.py"
        with open(membuf, 'r') as f:
            c = f.read()
        c = c.replace(
            'from multiprocessing import Value, Array, Queue',
            'from multiprocessing import Value, Array, Queue, Lock'
        )
        c = c.replace(
            'self._data_status = [Value(ctypes.c_bool, False, lock=True) for _ in range(max_sample_num)]',
            'self._data_status_arr = Array(ctypes.c_bool, max_sample_num, lock=False)  # lock_free_data_status\n        self._data_status_lock = Lock()  # single lock for all slots'
        )
        c = re.sub(r'with self\._data_status\[[^\]]+\]\.get_lock\(\):', 'with self._data_status_lock:', c)
        c = re.sub(r'self\._data_status\[([^\]]+)\]\.value\s*=\s*(True|False)', r'self._data_status_arr[\1] = \2', c)
        c = re.sub(r'self\._data_status\[([^\]]+)\]\.value', r'self._data_status_arr[\1]', c)
        with open(membuf, 'w') as f:
            f.write(c)
        print('[learner-patch] mem_buffer: replaced per-slot Value(lock=True) with lock-free Array + single Lock')
        MEMBUFPY
        fi
        if [ "$${KAIWU_PYTORCH_UPGRADE:-0}" = "1" ]; then
          echo "[pytorch-upgrade] Upgrading pip and PyTorch..."
          LC_ALL=C.UTF-8 pip install --quiet --upgrade pip setuptools
          LC_ALL=C.UTF-8 pip install --quiet torch==2.2.0 --index-url https://download.pytorch.org/whl/cu118
          python3 -c "import torch; print('[pytorch-upgrade] PyTorch', torch.__version__)"
        fi
        bash -c '/root/tools/start_train_client.sh learner & sleep 10 && python3 /data/projects/robot_vacuum/kaiwudrl/post_init_patch.py && wait'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    profiles:
      - single
      - distributed

  # ==================== AISrv AI服务器 ====================
  aisrv:
    image: 'kaiwu-pub.tencentcloudcr.com/project/${KAIWU_PROJECT_CODE}/edu/win_gpu:${KAIWU_PROJECT_VERSION}'
    volumes:
      - '${KAIWU_BACKUP_MODEL}:/workspace/train/backup_model'
      - shared_volume_train:/workspace/train
      - '${KAIWU_TRAIN_LOG}:/workspace/log'
      - '${KAIWU_CODE_FILE}:/workspace/code'
      # Archive directory for experiment tracking
      - '${KAIWU_ARCHIVE_DIR}:/workspace/archive'
    labels:
      - 'kaiwu=train-check'
    environment:
      <<: *env
    depends_on:
      - pushgateway
      - gamecore
      - learner
    command:
      - bash
      - '-lc'
      - |
        set -euo pipefail
        : "$${KAIWU_AISRV_NUM:?KAIWU_AISRV_NUM is required}"
        : "$${KAIWU_AISRV_GPU1_NUM:?KAIWU_AISRV_GPU1_NUM is required}"
        : "$${KAIWU_AISRV_GPU2_NUM:?KAIWU_AISRV_GPU2_NUM is required}"
        : "$${KAIWU_AISRV_GPU1:?KAIWU_AISRV_GPU1 is required}"
        : "$${KAIWU_AISRV_GPU2:?KAIWU_AISRV_GPU2 is required}"
        : "$${KAIWU_AISRV_GPU3:?KAIWU_AISRV_GPU3 is required}"
        routing_output="$$(python3 /workspace/code/agent_ppo/utils/container_routing.py \
            --project-name "${COMPOSE_PROJECT_NAME}" \
            --service-count "${KAIWU_AISRV_NUM}" \
            --gpu1-num "${KAIWU_AISRV_GPU1_NUM}" \
            --gpu2-num "${KAIWU_AISRV_GPU2_NUM}" \
            --gpu1 "${KAIWU_AISRV_GPU1}" \
            --gpu2 "${KAIWU_AISRV_GPU2}" \
            --gpu3 "${KAIWU_AISRV_GPU3}" \
            --resolution-attempts 10 \
            --retry-delay-seconds 1)" || {
            echo "[aisrv-routing] failed to resolve container index or GPU target" >&2
            exit 1
        }
        while IFS= read -r routing_line; do
            [[ -n "$$routing_line" ]] || continue
            if [[ ! "$$routing_line" =~ ^export[[:space:]][A-Za-z_][A-Za-z0-9_]*= ]]; then
                echo "[aisrv-routing] unexpected routing output format: $$routing_line" >&2
                exit 1
            fi
        done <<< "$$routing_output"
        eval "$$routing_output"
        if [[ -z "$${KAIWU_AISRV_INDEX:-}" || -z "$${KAIWU_AISRV_TARGET_GPU:-}" ]]; then
            echo "[aisrv-routing] resolved empty routing output" >&2
            exit 1
        fi
        echo "[aisrv-runtime] hostname=$${KAIWU_AISRV_CURRENT_NAME:-unset} current_ip=$${KAIWU_AISRV_CURRENT_IP:-unset} aisrv_index=$${KAIWU_AISRV_INDEX:-unset} target_gpu=$${KAIWU_AISRV_TARGET_GPU:-unset} cuda_visible_devices=$${CUDA_VISIBLE_DEVICES:-unset} replay_buffer_type=${KAIWU_EXPERIMENT_REPLAY_BUFFER_TYPE:-reverb} predict_batch_size=${KAIWU_EXPERIMENT_PREDICT_BATCH_SIZE:-unset} send_sample_size=${KAIWU_EXPERIMENT_SEND_SAMPLE_SIZE:-unset}"
        python3 - <<'PY'
        from pathlib import Path
        import os

        project = os.environ.get("KAIWU_PROJECT_CODE", "robot_vacuum")
        root = Path(f"/data/projects/{project}")

        spawn_snippets = [
            "\n".join([
                "import multiprocessing as mp",
                "",
                'if sys.platform.startswith("linux") and mp.get_start_method(allow_none=True) != "spawn":',
                '    mp.set_start_method("spawn", force=True)',
                "",
            ]),
            "\\n".join([
                "import multiprocessing as mp",
                "",
                'if sys.platform.startswith("linux") and mp.get_start_method(allow_none=True) != "spawn":',
                '    mp.set_start_method("spawn", force=True)',
                "",
            ]),
        ]

        for relative in (
            "kaiwudrl/server/learner/learner.py",
            "kaiwudrl/server/aisrv/aisrv.py",
        ):
            target = root / relative
            if not target.exists():
                continue
            text = target.read_text()
            original = text
            for snippet in spawn_snippets:
                if snippet in text:
                    text = text.replace(snippet, "", 1)
            if text != original:
                target.write_text(text)

        monitor_target = root / "common_python/monitor/monitor_manager.py"
        text = monitor_target.read_text()
        queue_marker = '_shared_queue = multiprocessing.Queue(CONFIG.queue_size)'
        if queue_marker not in text:
            if "import sys\n" not in text:
                text = text.replace("import multiprocessing\n", "import multiprocessing\nimport sys\n", 1)
            if "from common_python.config.config_control import CONFIG\n" not in text:
                text = text.replace(
                    "from common_python.logging.kaiwu_logger import KaiwuLogger\n",
                    "from common_python.logging.kaiwu_logger import KaiwuLogger\nfrom common_python.config.config_control import CONFIG\n",
                    1,
                )
            old = "\n".join([
                "def _get_shared_queue():",
                '    """延迟创建共享队列（避免 fork 后的连接问题）"""',
                "    global _manager, _shared_queue",
                "    if _shared_queue is None:",
                "        _manager = multiprocessing.Manager()",
                "        _shared_queue = _manager.Queue()",
                "    return _shared_queue",
                "",
            ])
            new = "\n".join([
                "def _get_shared_queue():",
                '    """延迟创建共享队列。Linux 独立训练优先使用原生 Queue，避免 Manager socket 断连。"""',
                "    global _manager, _shared_queue",
                "    if _shared_queue is None:",
                '        if sys.platform.startswith("linux"):',
                "            _shared_queue = multiprocessing.Queue(CONFIG.queue_size)",
                "        else:",
                "            _manager = multiprocessing.Manager()",
                "            _shared_queue = _manager.Queue()",
                "    return _shared_queue",
                "",
            ])
            if old not in text:
                raise SystemExit(f"Failed to patch {monitor_target}: queue function anchor not found")
            text = text.replace(old, new, 1)
            monitor_target.write_text(text)

        model_file_common_target = root / "kaiwudrl/common/checkpoint/model_file_common.py"
        text = model_file_common_target.read_text()
        clear_user_marker = "for entry in os.listdir(model_path):"
        if clear_user_marker not in text:
            old = "\n".join([
                "def clear_user_ckpt_dir():",
                '    """',
                "    清空/data/user_ckpt/下的文件夹内容, 在进程启动时进行操作",
                "    为软链接时不做操作",
                '    """',
                "    model_path = CONFIG.user_ckpt_dir",
                "    if os.path.islink(model_path):",
                "        return",
                "",
                "    if os.path.exists(model_path):",
                "        shutil.rmtree(model_path)",
                "",
            ])
            new = "\n".join([
                "def clear_user_ckpt_dir():",
                '    """',
                "    清空/data/user_ckpt/下的文件夹内容, 在进程启动时进行操作",
                "    为软链接时不做操作",
                '    """',
                "    model_path = CONFIG.user_ckpt_dir",
                "    if os.path.islink(model_path):",
                "        return",
                "",
                "    if not os.path.exists(model_path):",
                "        return",
                "",
                "    # Linux 独立部署中该路径通常是挂载根目录，不能直接 rmtree 根挂载点。",
                "    for entry in os.listdir(model_path):",
                "        entry_path = os.path.join(model_path, entry)",
                "        try:",
                "            if os.path.islink(entry_path) or os.path.isfile(entry_path):",
                "                os.remove(entry_path)",
                "            elif os.path.isdir(entry_path):",
                "                shutil.rmtree(entry_path)",
                "        except FileNotFoundError:",
                "            continue",
                "",
            ])
            if old not in text:
                raise SystemExit(f"Failed to patch {model_file_common_target}: clear_user_ckpt_dir anchor not found")
            text = text.replace(old, new, 1)
            model_file_common_target.write_text(text)

        trainer_target = root / "kaiwudrl/server/learner/trainer.py"
        text = trainer_target.read_text()
        trainer_marker = 'self.logger.info("train skip model_file_saver process because push_to_cos is disabled")'
        if trainer_marker not in text:
            old = "\n".join([
                "        if self.agent_wrapper.is_chief:",
                "            # model_file_saver, 用于保存模型文件到持久化设备, 比如COS, 采用单独的进程处理, 只有主learner进程才会执行",
                "            self.model_file_saver = ModelFileSave()",
                "            self.model_file_saver.start()",
                "",
            ])
            new = "\n".join([
                "        self.model_file_saver = None",
                "        if self.agent_wrapper.is_chief:",
                "            # 独立 Linux 训练且未开启 COS 时，跳过额外 fork 的 model_file_saver 进程。",
                "            if int(CONFIG.push_to_cos):",
                "                self.model_file_saver = ModelFileSave()",
                "                self.model_file_saver.start()",
                "            else:",
                '                self.logger.info("train skip model_file_saver process because push_to_cos is disabled")',
                "",
            ])
            if old not in text:
                raise SystemExit(f"Failed to patch {trainer_target}: model_file_saver anchor not found")
            text = text.replace(old, new, 1)
        debug_marker = 'self.logger.info("train debug milestone after_alloc_utils")'
        if debug_marker not in text:
            replacements = [
                (
                    "        # 业务算法类监控值是个map形式\n        self.app_monitor_data = {}\n",
                    "        # 业务算法类监控值是个map形式\n        self.app_monitor_data = {}\n        self.logger.info(\"train debug milestone after_monitor_state_reset\")\n",
                ),
                (
                    "        self.alloc_util = AllocUtils(self.logger)\n",
                    "        self.alloc_util = AllocUtils(self.logger)\n        self.logger.info(\"train debug milestone after_alloc_utils\")\n",
                ),
                (
                    "        t.start()\n",
                    "        t.start()\n        self.logger.info(\"train debug milestone after_aisrv_thread_start\")\n",
                ),
                (
                    "            register_sigterm_handler(self.handle_sigterm, CONFIG.sigterm_pids_file)\n",
                    "            register_sigterm_handler(self.handle_sigterm, CONFIG.sigterm_pids_file)\n            self.logger.info(\"train debug milestone after_register_sigterm\")\n",
                ),
                (
                    "        if self.agent_wrapper.is_chief:\n            # 策略特定的初始化\n            self.strategy.before_run()\n",
                    "        if self.agent_wrapper.is_chief:\n            # 策略特定的初始化\n            self.logger.info(\"train debug milestone before_strategy_before_run\")\n            self.strategy.before_run()\n            self.logger.info(\"train debug milestone after_strategy_before_run\")\n",
                ),
            ]
            for old, new in replacements:
                if old not in text:
                    raise SystemExit(f"Failed to patch {trainer_target}: debug anchor not found for {old!r}")
                text = text.replace(old, new, 1)
            trainer_target.write_text(text)

        off_policy_target = root / "kaiwudrl/server/learner/off_policy_strategy.py"
        text = off_policy_target.read_text()
        if "from kaiwudrl.common.checkpoint.model_file_sync import ModelFileSync\n" not in text:
            text = text.replace(
                "from kaiwudrl.common.checkpoint.model_file_sync_wrapper import ModelFileSyncWrapper\n",
                "from kaiwudrl.common.checkpoint.model_file_sync_wrapper import ModelFileSyncWrapper\nfrom kaiwudrl.common.checkpoint.model_file_sync import ModelFileSync\n",
                1,
            )
        before_run_marker = "# Linux 独立训练中避免在 reverb/TF 线程启动后再 fork 同步进程。"
        if before_run_marker not in text:
            old = "\n".join([
                "        if CONFIG.wrapper_type == KaiwuDRLDefine.WRAPPER_REMOTE:",
                "            self.trainer.model_file_sync_wrapper = ModelFileSyncWrapper()",
                "            self.trainer.model_file_sync_wrapper.init()",
                "",
                "            # 只有在训练时才进行",
                "            if CONFIG.run_mode == KaiwuDRLDefine.RUN_MODE_TRAIN:",
                "                # off-policy场景下, 训练进程主动推送下第一个model文件到modelpool, 预加载和非预加载情况下都适合",
                "                push_model_success = (",
                "                    self.trainer.model_file_sync_wrapper.ckpt_sync_warper.push_checkpoint_to_model_pool(",
                "                        self.trainer.logger",
                "                    )",
                "                )",
                "                if push_model_success:",
                '                    self.trainer.logger.info(f"train first model file push to modelpool success")',
                "                else:",
                '                    self.trainer.logger.error(f"train first model file push to modelpool failed")',
                "",
            ])
            new = "\n".join([
                "        if CONFIG.wrapper_type == KaiwuDRLDefine.WRAPPER_REMOTE:",
                "            self.trainer.model_file_sync_wrapper = ModelFileSyncWrapper()",
                "            # Linux 独立训练中避免在 reverb/TF 线程启动后再 fork 同步进程。",
                "            self.trainer.model_file_sync_wrapper.ckpt_sync_warper = ModelFileSync()",
                "",
                "            # 只有在训练时才进行",
                "            if CONFIG.run_mode == KaiwuDRLDefine.RUN_MODE_TRAIN:",
                "                # off-policy场景下, 训练进程主动推送下第一个model文件到modelpool, 预加载和非预加载情况下都适合",
                "                push_model_success = (",
                "                    self.trainer.model_file_sync_wrapper.ckpt_sync_warper.push_checkpoint_to_model_pool(",
                "                        self.trainer.logger",
                "                    )",
                "                )",
                "                if push_model_success:",
                '                    self.trainer.logger.info(f"train first model file push to modelpool success")',
                "                else:",
                '                    self.trainer.logger.error(f"train first model file push to modelpool failed")',
                "",
            ])
            if old not in text:
                raise SystemExit(f"Failed to patch {off_policy_target}: before_run anchor not found")
            text = text.replace(old, new, 1)

        process_marker = 'self.trainer.logger.info(f"train push checkpoint {model_file_id} to modelpool success")'
        if process_marker not in text:
            old = "\n".join([
                "    def process_policy_specific(self, model_file_id):",
                '        """',
                "        OffPolicy不需要特殊处理",
                '        """',
                "        pass",
                "",
            ])
            new = "\n".join([
                "    def process_policy_specific(self, model_file_id):",
                '        """',
                "        OffPolicy 在独立训练模式下直接同步新模型到 modelpool，避免额外 fork。",
                '        """',
                '        sync_wrapper = getattr(self.trainer, "model_file_sync_wrapper", None)',
                '        sync_worker = getattr(sync_wrapper, "ckpt_sync_warper", None)',
                "        if sync_worker is None:",
                "            return",
                "",
                "        push_model_success = sync_worker.push_checkpoint_to_model_pool(self.trainer.logger)",
                "        if push_model_success:",
                '            self.trainer.logger.info(f"train push checkpoint {model_file_id} to modelpool success")',
                "        else:",
                '            self.trainer.logger.error(f"train push checkpoint {model_file_id} to modelpool failed")',
                "",
            ])
            if old not in text:
                raise SystemExit(f"Failed to patch {off_policy_target}: process_policy_specific anchor not found")
            text = text.replace(old, new, 1)

        cleanup_marker = 'model_file_saver = getattr(self.trainer, "model_file_saver", None)'
        if cleanup_marker not in text:
            old = "\n".join([
                "    def cleanup(self):",
                '        """',
                "        OffPolicy清理操作",
                '        """',
                "        # 非on-policy的才需要主动关闭self.model_file_sync_wrapper",
                "        self.trainer.model_file_saver.stop()",
                '        self.trainer.logger.info("train self.agent_wrapper.close success")',
                "",
                "        self.trainer.model_file_sync_wrapper.stop()",
                '        self.trainer.logger.info("train self.model_file_sync_wrapper.stop success")',
                "",
            ])
            new = "\n".join([
                "    def cleanup(self):",
                '        """',
                "        OffPolicy清理操作",
                '        """',
                '        model_file_saver = getattr(self.trainer, "model_file_saver", None)',
                '        if model_file_saver is not None and model_file_saver.is_alive():',
                "            model_file_saver.stop()",
                '            self.trainer.logger.info("train self.agent_wrapper.close success")',
                "",
                '        sync_wrapper = getattr(self.trainer, "model_file_sync_wrapper", None)',
                '        sync_worker = getattr(sync_wrapper, "ckpt_sync_warper", None)',
                '        if sync_worker is not None and sync_worker.is_alive():',
                "            sync_worker.stop()",
                '            self.trainer.logger.info("train self.model_file_sync_wrapper.stop success")',
                "",
            ])
            if old not in text:
                raise SystemExit(f"Failed to patch {off_policy_target}: cleanup anchor not found")
            text = text.replace(old, new, 1)
        off_policy_target.write_text(text)

        def format_toml_value(value):
            if value.lower() in {"true", "false"}:
                return value.lower()
            try:
                int(value)
                return value
            except ValueError:
                return f'"{value}"'

        def replace_toml_key(target, key, env_name):
            env_value = os.environ.get(env_name)
            if env_value in (None, ""):
                return
            text = target.read_text()
            lines = text.splitlines()
            replacement = f"{key} = {format_toml_value(env_value)}"
            filtered = [line for line in lines if line.strip().split("=", 1)[0].strip() != key]
            updated = "\n".join(filtered)
            if updated:
                updated = f"{updated}\n{replacement}\n"
            else:
                updated = f"{replacement}\n"
            if updated != text:
                target.write_text(updated)

        # ---- Phase 2: Patch configure.toml for predict_batch_size (aisrv side) ----
        configure_toml = root / "kaiwudrl/conf/kaiwudrl/configure.toml"
        replace_toml_key(configure_toml, "predict_batch_size", "KAIWU_EXPERIMENT_PREDICT_BATCH_SIZE")
        replace_toml_key(configure_toml, "proxy_batch_size", "KAIWU_EXPERIMENT_PREDICT_BATCH_SIZE")

        # Write aisrv post-init patcher (runs after start_train_client.sh
        # because init_code.sh copies code/conf/ over project conf/)
        patcher = root / "kaiwudrl/aisrv_post_init_patch.py"
        patcher.write_text(
            "import os\n"
            "from pathlib import Path\n"
            "\n"
            "def format_toml_value(value):\n"
            "    try:\n"
            "        int(value)\n"
            "        return value\n"
            "    except ValueError:\n"
            "        return f'\"{value}\"'\n"
            "\n"
            "def replace_toml_key(target, key, env_name):\n"
            "    env_value = os.environ.get(env_name)\n"
            "    if env_value in (None, ''):\n"
            "        return\n"
            "    text = target.read_text()\n"
            "    lines = text.splitlines()\n"
            "    replacement = f'{key} = {format_toml_value(env_value)}'\n"
            "    filtered = [line for line in lines if line.strip().split('=', 1)[0].strip() != key]\n"
            "    updated = '\\n'.join(filtered)\n"
            "    if updated:\n"
            "        updated = f'{updated}\\n{replacement}\\n'\n"
            "    else:\n"
            "        updated = f'{replacement}\\n'\n"
            "    if updated != text:\n"
            "        target.write_text(updated)\n"
            "        print(f'[aisrv-post-init] {key} = {env_value}')\n"
            "\n"
            "project = os.environ.get('KAIWU_PROJECT_CODE', 'robot_vacuum')\n"
            "root = Path(f'/data/projects/{project}')\n"
            "app_conf = root / 'conf/configure_app.toml'\n"
            "replace_toml_key(app_conf, 'replay_buffer_type', 'KAIWU_EXPERIMENT_REPLAY_BUFFER_TYPE')\n"
            "replace_toml_key(app_conf, 'send_sample_size', 'KAIWU_EXPERIMENT_SEND_SAMPLE_SIZE')\n"
        )
        PY
        if [ -n "${KAIWU_EXPERIMENT_REPLAY_BUFFER_TYPE:-}" ]; then
          sed -i "s|sh tools/change_sample_server.sh reverb|sh tools/change_sample_server.sh ${KAIWU_EXPERIMENT_REPLAY_BUFFER_TYPE}|g" /root/tools/common.sh
          echo "[aisrv-sed] Patched common.sh to use ${KAIWU_EXPERIMENT_REPLAY_BUFFER_TYPE}"
        fi
        bash -c '/root/tools/start_train_client.sh aisrv & sleep 10 && python3 /data/projects/robot_vacuum/kaiwudrl/aisrv_post_init_patch.py && wait'
    scale: ${KAIWU_AISRV_NUM}
    profiles:
      - distributed

  # ==================== KaiwuEnv 环境包装器 ====================
  kaiwu_env:
    image: 'kaiwu-pub.tencentcloudcr.com/project/${KAIWU_PROJECT_CODE}/edu/kaiwu_env_x86:${KAIWU_PROJECT_VERSION}'
    restart: always
    depends_on:
      - gamecore
      - pushgateway
    volumes:
      - '${KAIWU_TRAIN_LOG}:/workspace/log'
    environment:
      <<: *env
    command:
      - bash
      - '-c'
      - 'sleep 10000000'
    profiles:
      - packing
    scale: ${KAIWU_GAMECORE_NUM}

  # ==================== GameCore 游戏核心 ====================
  gamecore:
    image: 'kaiwu-pub.tencentcloudcr.com/project/${KAIWU_PROJECT_CODE}/edu/gamecore_${KAIWU_CPU_TYPE}:${KAIWU_PROJECT_VERSION}'
    restart: always
    volumes:
      - '${KAIWU_LICENSE_PATH}:/sgame/license.dat'
      - '${KAIWU_TRAIN_LOG}:/workspace/log'
    environment:
      <<: *env
    depends_on:
      - pushgateway
    command:
      - bash
      - '-c'
      - "bash /root/tools/start_train_client.sh gamecore"
    scale: ${KAIWU_GAMECORE_NUM}

 # ==================== Backup Model 模型备份服务 ====================
  backup_model:
    image: 'kaiwu-pub.tencentcloudcr.com/client/exp-service:master-b3e704f9-0202'
    restart: always
    volumes:
      - '${KAIWU_BACKUP_MODEL}:/workspace/train/backup_model'
      - '${KAIWU_BACKUP_MODEL}:/workspace/train/sign_model'
    environment:
      <<: *env
    command:
      - bash
      - '-c'
      - |
        cd /app/cluster/exp-service/client && \
        ./exp client train sidecar \
              --is-monitor=false --is-upload=false --is-sign

  # ==================== Pushgateway 指标中转服务 ====================
  # 接收 kaiwudrl 主动推送的指标，供 vector 定期拉取
  pushgateway:
    image: 'kaiwu-pub.tencentcloudcr.com/project/monitor/pushgateway_${KAIWU_CPU_TYPE}:20250609'
    restart: unless-stopped
    command:
      - '--log.level=debug'
      - '--persistence.file=/pushgateway/metrics.db'
      - '--push.disable-consistency-check'
      - '--persistence.interval=5m'

  # ==================== GreptimeDB 时序数据库 ====================
  # 提供 Prometheus 兼容接口和 SQL 查询接口
  greptimedb:
    image: kaiwu-pub.tencentcloudcr.com/client/greptimedb:v1.0.0-beta.3
    restart: unless-stopped
    command:
      - standalone
      - start
      - --http-addr
      - 0.0.0.0:4000
      - --rpc-bind-addr
      - 0.0.0.0:4001
    ports:
      - '${GREPTIMEDB_HTTP_PORT:-4000}:4000'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ==================== Vector 日志和指标采集 ====================
  # 采集日志和指标，发送到 GreptimeDB
  vector:
    image: kaiwu-pub.tencentcloudcr.com/client/vector:v5.38.10-dev.8
    restart: unless-stopped
    entrypoint: ['bash', '-c', '/init_greptime.sh && /start.sh client']
    environment:
      <<: *env
      greptime_host: greptimedb
      train_metric_endpoint: http://pushgateway:9091/metrics
    volumes:
      - '${KAIWU_TRAIN_LOG}:/workspace/log'
    depends_on:
      pushgateway:
        condition: service_started
      greptimedb:
        condition: service_healthy

  # ==================== Monitor Service 监控服务 ====================
  # 提供监控数据查询接口
  monitor-service:
    image: kaiwu-pub.tencentcloudcr.com/client/monitor-service:v5.38.10-3c07f9dc
    restart: unless-stopped
    ports:
      - '${MONITOR_TRPC_PORT}:8040'
    volumes:
      - shared_volume_train:/workspace/train
    depends_on:
      greptimedb:
        condition: service_healthy
      vector:
        condition: service_started

  # ==================== FE Monitor Service 前端监控服务 ====================
  # 提供监控 Web 页面
  fe-monitor-service:
    image: kaiwu-pub.tencentcloudcr.com/client/fe-monitor-service:20260316170132
    restart: unless-stopped
    ports:
      - '${KAIWU_MONITOR_PORT}:3000'
    environment:
      RUNTIME_MODE: client
      server_req_base_url: http://127.0.0.1:${MONITOR_TRPC_PORT}
      USER_ID: ${USER_ID}
      MONITOR_ID: ${MONITOR_ID}
      TRACKER_ID: ${TRACKER_ID}
      CLIENT_ENV: ${CLIENT_ENV}
      KAIWU_CLIENT_VERSION: ${KAIWU_CLIENT_VERSION}
      is_rainbow: false
    depends_on:
      monitor-service:
        condition: service_started

volumes:
  shared_volume_train:
