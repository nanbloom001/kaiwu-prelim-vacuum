version: '3.8'

x-kaiwu-client:
  docker_registry: kaiwu-pub.tencentcloudcr.com
  version_path: ./code/kaiwu.json
  monitor_url: 'http://127.0.0.1:${KAIWU_MONITOR_PORT}/p/v5/exp/monitor?domain_id=1&exp_id=1&task_uuid=1&task_id=0&platform=competition_stage'
  extra:
    back_to_the_realm:
      extra_cmd: '--profile packing'
    intelligent_traffic_lights:
      extra_cmd: '--profile packing'
    back_to_the_realm_v2:
      extra_cmd: '--profile packing'
    intelligent_traffic_lights_v2:
      extra_cmd: '--profile packing'

  # # 共享环境变量
  environment: &env # KaiwuDRL 框架配置
    # 未在 .env 中定义的变量（硬编码）
    use_alloc: False
    push_to_cos: False
    use_rainbow: False
    use_prometheus: True
    prometheus_pushgateway: pushgateway:9091
    monitor_version: v2
    KAIWU_FEATURE_CONFIG: ""
    KAIWU_TRAIN_TIME: 3600
    KAIWU_RUNNING_MODE: normal
    KAIWU_REWARD_CONFIG: ""
    KAIWU_EXPERIMENT_ID: 0
    KAIWU_MONITOR_VERSION: v2
    # 在 .env 中定义的变量（从 .env 引用）
    KAIWU_PROJECT_CODE: ${KAIWU_PROJECT_CODE}
    KAIWU_PROJECT_VERSION: ${KAIWU_PROJECT_VERSION}
    KAIWU_MONITOR_PORT: ${KAIWU_MONITOR_PORT}
    KAIWU_PARALLEL_ENV_PER_AISRV: ${KAIWU_PARALLEL_ENV_PER_AISRV}
    KAIWU_AISRV_NUM: ${KAIWU_AISRV_NUM}
    KAIWU_TRAINING_MODE: ${KAIWU_TRAINING_MODE}
    KAIWU_ALGORITHM: ${KAIWU_ALGORITHM}
    KAIWU_GAMECORE_NUM: ${KAIWU_GAMECORE_NUM}
    KAIWU_TASK_ID: ${KAIWU_TASK_ID}
    KAIWU_TASK_UUID: ${KAIWU_TASK_UUID}
    KAIWU_SET_CNT: ${KAIWU_SET_CNT}
    KAIWU_SET_INDEX: ${KAIWU_SET_INDEX}
    KAIWU_DOMAIN_TYPE: ${KAIWU_DOMAIN_TYPE}
    KAIWU_PLAYER_TYPE: ${KAIWU_PLAYER_TYPE}
    KAIWU_DOMAIN_ID: ${KAIWU_DOMAIN_ID}
    KAIWU_PLAYER_ID: ${KAIWU_PLAYER_ID}
    KAIWU_PUBLIC_KEY: ${KAIWU_PUBLIC_KEY}
    KAIWU_EXPERIMENT_REPLAY_BUFFER_TYPE: ${KAIWU_EXPERIMENT_REPLAY_BUFFER_TYPE:-reverb}
    KAIWU_PYTORCH_READ_DATA_FROM_REVERB_TYPE: ${KAIWU_PYTORCH_READ_DATA_FROM_REVERB_TYPE:-1}
    KAIWU_EXPERIMENT_TRAIN_BATCH_SIZE: ${KAIWU_EXPERIMENT_TRAIN_BATCH_SIZE:-4096}
    KAIWU_EXPERIMENT_SEND_SAMPLE_SIZE: ${KAIWU_EXPERIMENT_SEND_SAMPLE_SIZE:-4096}
    KAIWU_EXPERIMENT_DUMP_MODEL_FREQ: ${KAIWU_EXPERIMENT_DUMP_MODEL_FREQ:-5000}
    KAIWU_EXPERIMENT_MODEL_FILE_SYNC_PER_MINUTES: ${KAIWU_EXPERIMENT_MODEL_FILE_SYNC_PER_MINUTES:-3}
    KAIWU_EXPERIMENT_PREDICT_BATCH_SIZE: ${KAIWU_EXPERIMENT_PREDICT_BATCH_SIZE:-64}
    KAIWU_EXPERIMENT_REPLAY_BUFFER_CACHE_MULTIPLIER: ${KAIWU_EXPERIMENT_REPLAY_BUFFER_CACHE_MULTIPLIER:-4}
    KAIWU_EXPERIMENT_REPLAY_BUFFER_CAPACITY: ${KAIWU_EXPERIMENT_REPLAY_BUFFER_CAPACITY:-10000}
    KAIWU_EXPERIMENT_PRELOAD_RATIO: ${KAIWU_EXPERIMENT_PRELOAD_RATIO:-0.1}
    KAIWU_EXPERIMENT_REVERB_RATE_LIMITER: ${KAIWU_EXPERIMENT_REVERB_RATE_LIMITER:-MinSize}
    KAIWU_EXPERIMENT_REVERB_SAMPLER: ${KAIWU_EXPERIMENT_REVERB_SAMPLER:-reverb.selectors.Fifo}
    KAIWU_PERF_STAT_WINDOW_SECONDS: ${KAIWU_PERF_STAT_WINDOW_SECONDS:-60}

services:
  # ==================== Learner 学习器 ====================
  learner:
    image: 'kaiwu-pub.tencentcloudcr.com/project/${KAIWU_PROJECT_CODE}/edu/win_gpu:${KAIWU_PROJECT_VERSION}'
    volumes:
      - shared_volume_model:/workspace/train/backup_model
      - shared_volume_train:/workspace/train
      - '${KAIWU_TRAIN_LOG}:/workspace/log'
      - '${KAIWU_CODE_FILE}:/workspace/code'
    environment:
      <<: *env
      KAIWU_SERVICE_NAME: learner
    labels:
      - 'kaiwu=train-check'
    depends_on:
      - backup_model
      - pushgateway
      - gamecore
    command:
      - bash
      - '-lc'
      - |
        set -euo pipefail
        echo "[learner-runtime] replay_buffer_type=$${KAIWU_EXPERIMENT_REPLAY_BUFFER_TYPE:-reverb} train_batch_size=$${KAIWU_EXPERIMENT_TRAIN_BATCH_SIZE:-unset} send_sample_size=$${KAIWU_EXPERIMENT_SEND_SAMPLE_SIZE:-unset} predict_batch_size=$${KAIWU_EXPERIMENT_PREDICT_BATCH_SIZE:-unset}"
        python3 - <<'PY'
        from pathlib import Path
        import os
        import sys

        project = os.environ.get("KAIWU_PROJECT_CODE", "robot_vacuum")
        root = Path(f"/data/projects/{project}")
        sys.path.insert(0, "/workspace/code")

        from agent_ppo.utils.zmq_patch import patch_zmq_runtime_files

        replay_buffer_type = os.environ.get("KAIWU_EXPERIMENT_REPLAY_BUFFER_TYPE", "reverb")
        patched = patch_zmq_runtime_files(root, replay_buffer_type)
        for target in patched:
            print(f"[learner-zmq] patched spawn context in {target}")

        if replay_buffer_type.strip().lower() == "zmq":
            for relative in (
                "kaiwudrl/common/utils/mem_buffer.py",
                "kaiwudrl/common/utils/mem_buffer_ratio.py",
            ):
                target = root / relative
                if not target.exists():
                    continue
                text = target.read_text()
                original = text
                text = text.replace(
                    "        self.device = \"cpu\"\n        if torch.cuda.is_available():\n            self.device = \"cuda\"\n",
                    "        # ZMQ: avoid CUDA init in parent before fork; trainer moves tensors later.\n        self.device = \"cpu\"\n",
                    1,
                )
                text = text.replace(
                    '        self.device = "cuda" if torch.cuda.is_available() else "cpu"\n',
                    '        # ZMQ: avoid CUDA init in parent before fork; trainer moves tensors later.\n        self.device = "cpu"\n',
                    1,
                )
                if text != original:
                    target.write_text(text)
                    print(f"[learner-zmq] forced CPU-only mem_buffer init in {target}")

            mem_buffer_target = root / "kaiwudrl/common/utils/mem_buffer.py"
            if mem_buffer_target.exists():
                text = mem_buffer_target.read_text()
                original = text
                text = text.replace(
                    "from multiprocessing import Value, Array, Queue",
                    "from multiprocessing import Value, Array, Queue, Lock",
                    1,
                )
                text = text.replace(
                    "self._data_status = [Value(ctypes.c_bool, False, lock=True) for _ in range(max_sample_num)]",
                    "self._data_status_arr = Array(ctypes.c_bool, max_sample_num, lock=False)  # lock_free_data_status\n        self._data_status_lock = Lock()",
                    1,
                )
                text = text.replace("with self._data_status[partition_index].get_lock():", "with self._data_status_lock:")
                text = text.replace("with self._data_status[index].get_lock():", "with self._data_status_lock:")
                text = text.replace("with self._data_status[idx].get_lock():", "with self._data_status_lock:")
                text = text.replace("with self._data_status[i].get_lock():", "with self._data_status_lock:")
                text = text.replace("self._data_status[partition_index].value", "self._data_status_arr[partition_index]")
                text = text.replace("self._data_status[index].value", "self._data_status_arr[index]")
                text = text.replace("self._data_status[idx].value", "self._data_status_arr[idx]")
                text = text.replace("self._data_status[i].value", "self._data_status_arr[i]")
                if text != original:
                    mem_buffer_target.write_text(text)
                    print(f"[learner-zmq] patched mem_buffer lock-free status array in {mem_buffer_target}")

        patcher = root / "kaiwudrl/post_init_patch.py"
        patcher.write_text(
            "import os\n"
            "from pathlib import Path\n"
            "\n"
            "def format_toml_value(value):\n"
            "    value = str(value)\n"
            "    if value.lower() in {'true', 'false'}:\n"
            "        return value.lower()\n"
            "    try:\n"
            "        int(value)\n"
            "        return value\n"
            "    except ValueError:\n"
            "        try:\n"
            "            float(value)\n"
            "            return value\n"
            "        except ValueError:\n"
            "            pass\n"
            "    try:\n"
            "        return f'\"{value}\"'\n"
            "    except ValueError:\n"
            "        return f'\"{value}\"'\n"
            "\n"
            "def replace_toml_key(target, key, env_name):\n"
            "    env_value = os.environ.get(env_name)\n"
            "    if env_value in (None, '') or not target.exists():\n"
            "        return\n"
            "    lines = target.read_text().splitlines()\n"
            "    replacement = f'{key} = {format_toml_value(env_value)}'\n"
            "    filtered = [line for line in lines if line.strip().split('=', 1)[0].strip() != key]\n"
            "    filtered.append(replacement)\n"
            "    target.write_text('\\n'.join(filtered) + '\\n')\n"
            "    print(f'[post-init] {key} = {env_value}')\n"
            "\n"
            "project = os.environ.get('KAIWU_PROJECT_CODE', 'robot_vacuum')\n"
            "root = Path(f'/data/projects/{project}')\n"
            "app_conf = root / 'conf/configure_app.toml'\n"
            "learner_conf = root / 'kaiwudrl/conf/kaiwudrl/learner.toml'\n"
            "configure_toml = root / 'kaiwudrl/conf/kaiwudrl/configure.toml'\n"
            "replace_toml_key(app_conf, 'train_batch_size', 'KAIWU_EXPERIMENT_TRAIN_BATCH_SIZE')\n"
            "replace_toml_key(app_conf, 'replay_buffer_capacity', 'KAIWU_EXPERIMENT_REPLAY_BUFFER_CAPACITY')\n"
            "replace_toml_key(app_conf, 'preload_ratio', 'KAIWU_EXPERIMENT_PRELOAD_RATIO')\n"
            "replace_toml_key(app_conf, 'dump_model_freq', 'KAIWU_EXPERIMENT_DUMP_MODEL_FREQ')\n"
            "replace_toml_key(app_conf, 'model_file_sync_per_minutes', 'KAIWU_EXPERIMENT_MODEL_FILE_SYNC_PER_MINUTES')\n"
            "replace_toml_key(app_conf, 'reverb_rate_limiter', 'KAIWU_EXPERIMENT_REVERB_RATE_LIMITER')\n"
            "replace_toml_key(app_conf, 'reverb_sampler', 'KAIWU_EXPERIMENT_REVERB_SAMPLER')\n"
            "replace_toml_key(configure_toml, 'dump_model_freq', 'KAIWU_EXPERIMENT_DUMP_MODEL_FREQ')\n"
            "replace_toml_key(configure_toml, 'model_file_sync_per_minutes', 'KAIWU_EXPERIMENT_MODEL_FILE_SYNC_PER_MINUTES')\n"
            "replace_toml_key(learner_conf, 'pytorch_read_data_from_reverb_type', 'KAIWU_PYTORCH_READ_DATA_FROM_REVERB_TYPE')\n"
            "replace_toml_key(learner_conf, 'replay_buffer_cache_multiplier', 'KAIWU_EXPERIMENT_REPLAY_BUFFER_CACHE_MULTIPLIER')\n"
            "replace_toml_key(configure_toml, 'predict_batch_size', 'KAIWU_EXPERIMENT_PREDICT_BATCH_SIZE')\n"
            "replace_toml_key(configure_toml, 'proxy_batch_size', 'KAIWU_EXPERIMENT_PREDICT_BATCH_SIZE')\n"
        )
        PY
        project_default=/root/tools/conf/project_default.toml
        if [ -n "$${KAIWU_EXPERIMENT_DUMP_MODEL_FREQ:-}" ]; then
          sed -i "s|^dump_model_freq = .*|dump_model_freq = $${KAIWU_EXPERIMENT_DUMP_MODEL_FREQ}|g" "$${project_default}"
        fi
        if [ -n "$${KAIWU_EXPERIMENT_MODEL_FILE_SYNC_PER_MINUTES:-}" ]; then
          sed -i "s|^model_file_sync_per_minutes = .*|model_file_sync_per_minutes = $${KAIWU_EXPERIMENT_MODEL_FILE_SYNC_PER_MINUTES}|g" "$${project_default}"
        fi
        if [ -n "$${KAIWU_EXPERIMENT_REPLAY_BUFFER_TYPE:-}" ]; then
          sed -i "s|sh tools/change_sample_server.sh reverb|sh tools/change_sample_server.sh $${KAIWU_EXPERIMENT_REPLAY_BUFFER_TYPE}|g" /root/tools/common.sh
          echo "[learner-sed] patched common.sh to use $${KAIWU_EXPERIMENT_REPLAY_BUFFER_TYPE}"
        fi
        bash -c '/root/tools/start_train_client.sh learner & sleep 10 && python3 /data/projects/robot_vacuum/kaiwudrl/post_init_patch.py && wait'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    profiles:
      - single
      - distributed

  # ==================== AISrv AI服务器 ====================
  aisrv:
    image: 'kaiwu-pub.tencentcloudcr.com/project/${KAIWU_PROJECT_CODE}/edu/win_gpu:${KAIWU_PROJECT_VERSION}'
    volumes:
      - shared_volume_model:/workspace/train/backup_model
      - shared_volume_train:/workspace/train
      - '${KAIWU_TRAIN_LOG}:/workspace/log'
      - '${KAIWU_CODE_FILE}:/workspace/code'
    labels:
      - 'kaiwu=train-check'
    environment:
      <<: *env
      KAIWU_SERVICE_NAME: aisrv
    depends_on:
      - pushgateway
      - gamecore
      - learner
    command:
      - bash
      - '-lc'
      - |
        set -euo pipefail
        echo "[aisrv-runtime] replay_buffer_type=$${KAIWU_EXPERIMENT_REPLAY_BUFFER_TYPE:-reverb} send_sample_size=$${KAIWU_EXPERIMENT_SEND_SAMPLE_SIZE:-unset} predict_batch_size=$${KAIWU_EXPERIMENT_PREDICT_BATCH_SIZE:-unset}"
        python3 - <<'PY'
        from pathlib import Path
        import os

        project = os.environ.get("KAIWU_PROJECT_CODE", "robot_vacuum")
        root = Path(f"/data/projects/{project}")
        patcher = root / "kaiwudrl/aisrv_post_init_patch.py"
        patcher.write_text(
            "import os\n"
            "from pathlib import Path\n"
            "\n"
            "def format_toml_value(value):\n"
            "    value = str(value)\n"
            "    if value.lower() in {'true', 'false'}:\n"
            "        return value.lower()\n"
            "    try:\n"
            "        int(value)\n"
            "        return value\n"
            "    except ValueError:\n"
            "        return f'\"{value}\"'\n"
            "\n"
            "def replace_toml_key(target, key, env_name):\n"
            "    env_value = os.environ.get(env_name)\n"
            "    if env_value in (None, '') or not target.exists():\n"
            "        return\n"
            "    lines = target.read_text().splitlines()\n"
            "    replacement = f'{key} = {format_toml_value(env_value)}'\n"
            "    filtered = [line for line in lines if line.strip().split('=', 1)[0].strip() != key]\n"
            "    filtered.append(replacement)\n"
            "    target.write_text('\\n'.join(filtered) + '\\n')\n"
            "    print(f'[aisrv-post-init] {key} = {env_value}')\n"
            "\n"
            "project = os.environ.get('KAIWU_PROJECT_CODE', 'robot_vacuum')\n"
            "root = Path(f'/data/projects/{project}')\n"
            "app_conf = root / 'conf/configure_app.toml'\n"
            "configure_toml = root / 'kaiwudrl/conf/kaiwudrl/configure.toml'\n"
            "replace_toml_key(configure_toml, 'predict_batch_size', 'KAIWU_EXPERIMENT_PREDICT_BATCH_SIZE')\n"
            "replace_toml_key(configure_toml, 'proxy_batch_size', 'KAIWU_EXPERIMENT_PREDICT_BATCH_SIZE')\n"
        )
        PY
        if [ -n "$${KAIWU_EXPERIMENT_REPLAY_BUFFER_TYPE:-}" ]; then
          sed -i "s|sh tools/change_sample_server.sh reverb|sh tools/change_sample_server.sh $${KAIWU_EXPERIMENT_REPLAY_BUFFER_TYPE}|g" /root/tools/common.sh
          echo "[aisrv-sed] patched common.sh to use $${KAIWU_EXPERIMENT_REPLAY_BUFFER_TYPE}"
        fi
        project_default=/root/tools/conf/project_default.toml
        if [ -n "$${KAIWU_EXPERIMENT_DUMP_MODEL_FREQ:-}" ]; then
          sed -i "s|^dump_model_freq = .*|dump_model_freq = $${KAIWU_EXPERIMENT_DUMP_MODEL_FREQ}|g" "$${project_default}"
        fi
        if [ -n "$${KAIWU_EXPERIMENT_MODEL_FILE_SYNC_PER_MINUTES:-}" ]; then
          sed -i "s|^model_file_sync_per_minutes = .*|model_file_sync_per_minutes = $${KAIWU_EXPERIMENT_MODEL_FILE_SYNC_PER_MINUTES}|g" "$${project_default}"
        fi
        bash -c '/root/tools/start_train_client.sh aisrv & sleep 10 && python3 /data/projects/robot_vacuum/kaiwudrl/aisrv_post_init_patch.py && wait'
    scale: ${KAIWU_AISRV_NUM}
    profiles:
      - distributed

  # ==================== KaiwuEnv 环境包装器 ====================
  kaiwu_env:
    image: 'kaiwu-pub.tencentcloudcr.com/project/${KAIWU_PROJECT_CODE}/edu/kaiwu_env_x86:${KAIWU_PROJECT_VERSION}'
    restart: always
    depends_on:
      - gamecore
      - pushgateway
    volumes:
      - '${KAIWU_TRAIN_LOG}:/workspace/log'
    environment:
      <<: *env
    command:
      - bash
      - '-c'
      - 'sleep 10000000'
    profiles:
      - packing
    scale: ${KAIWU_GAMECORE_NUM}

  # ==================== GameCore 游戏核心 ====================
  gamecore:
    image: 'kaiwu-pub.tencentcloudcr.com/project/${KAIWU_PROJECT_CODE}/edu/gamecore_${KAIWU_CPU_TYPE}:${KAIWU_PROJECT_VERSION}'
    restart: always
    volumes:
      - '${KAIWU_LICENSE_PATH}:/sgame/license.dat'
      - '${KAIWU_TRAIN_LOG}:/workspace/log'
    environment:
      <<: *env
    depends_on:
      - pushgateway
    command:
      - bash
      - '-c'
      - "bash /root/tools/start_train_client.sh gamecore"
    scale: ${KAIWU_GAMECORE_NUM}

 # ==================== Backup Model 模型备份服务 ====================
  backup_model:
    image: 'kaiwu-pub.tencentcloudcr.com/client/exp-service:master-b3e704f9-0202'
    restart: always
    volumes:
      - shared_volume_model:/workspace/train/backup_model
      - '${KAIWU_BACKUP_MODEL}:/workspace/train/sign_model'
    environment:
      <<: *env
    command:
      - bash
      - '-c'
      - |
        cd /app/cluster/exp-service/client && \
        ./exp client train sidecar \
              --is-monitor=false --is-upload=false --is-sign

  # ==================== Pushgateway 指标中转服务 ====================
  # 接收 kaiwudrl 主动推送的指标，供 vector 定期拉取
  pushgateway:
    image: 'kaiwu-pub.tencentcloudcr.com/project/monitor/pushgateway_${KAIWU_CPU_TYPE}:20250609'
    restart: unless-stopped
    command:
      - '--log.level=debug'
      - '--persistence.file=/pushgateway/metrics.db'
      - '--push.disable-consistency-check'
      - '--persistence.interval=5m'

  # ==================== GreptimeDB 时序数据库 ====================
  # 提供 Prometheus 兼容接口和 SQL 查询接口
  greptimedb:
    image: kaiwu-pub.tencentcloudcr.com/client/greptimedb:v1.0.0-beta.3
    restart: unless-stopped
    command:
      - standalone
      - start
      - --http-addr
      - 0.0.0.0:4000
      - --rpc-bind-addr
      - 0.0.0.0:4001
    ports:
      - '4000:4000'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ==================== Vector 日志和指标采集 ====================
  # 采集日志和指标，发送到 GreptimeDB
  vector:
    image: kaiwu-pub.tencentcloudcr.com/client/vector:v5.38.10-dev.8
    restart: unless-stopped
    entrypoint: ['bash', '-c', '/init_greptime.sh && /start.sh client']
    environment:
      <<: *env
      greptime_host: greptimedb
      train_metric_endpoint: http://pushgateway:9091/metrics
    volumes:
      - '${KAIWU_TRAIN_LOG}:/workspace/log'
    depends_on:
      pushgateway:
        condition: service_started
      greptimedb:
        condition: service_healthy

  # ==================== Monitor Service 监控服务 ====================
  # 提供监控数据查询接口
  monitor-service:
    image: kaiwu-pub.tencentcloudcr.com/client/monitor-service:v5.38.10-3c07f9dc
    restart: unless-stopped
    ports:
      - '${MONITOR_TRPC_PORT}:8040'
    volumes:
      - shared_volume_train:/workspace/train
    depends_on:
      greptimedb:
        condition: service_healthy
      vector:
        condition: service_started

  # ==================== FE Monitor Service 前端监控服务 ====================
  # 提供监控 Web 页面
  fe-monitor-service:
    image: kaiwu-pub.tencentcloudcr.com/client/fe-monitor-service:20260316170132
    restart: unless-stopped
    ports:
      - '${KAIWU_MONITOR_PORT}:3000'
    environment:
      RUNTIME_MODE: client
      server_req_base_url: http://127.0.0.1:${MONITOR_TRPC_PORT}
      USER_ID: ${USER_ID}
      MONITOR_ID: ${MONITOR_ID}
      TRACKER_ID: ${TRACKER_ID}
      CLIENT_ENV: ${CLIENT_ENV}
      KAIWU_CLIENT_VERSION: ${KAIWU_CLIENT_VERSION}
      is_rainbow: false
    depends_on:
      monitor-service:
        condition: service_started

volumes:
  shared_volume_model:
  shared_volume_train:
