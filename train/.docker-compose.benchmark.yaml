# Benchmark overlay for win_YJY holdout benchmark.
#
# Usage:
#   docker compose -p kaiwu-benchmark \
#     -f train/.docker-compose.yaml \
#     -f train/.docker-compose.benchmark.yaml \
#     --profile distributed up -d
#
# This overlay:
#   - Sets KAIWU_BENCHMARK_MODE=1 on aisrv to trigger holdout_benchmark.py
#   - Disables learner, backup_model, pushgateway (not needed for inference)
#   - Configures holdout maps and episodes per map via env vars
#
# Environment variables:
#   KAIWU_BENCHMARK_MAPS         — comma-separated map IDs (default: 4,7)
#   KAIWU_BENCHMARK_EPISODES_PER_MAP episodes per map (default: 4)
#   KAIWU_BENCHMARK_CHECKPOINT   — checkpoint path relative to /workspace/code (default: model.ckpt-resume.pkl)

#   KAIWU_BENCHMARK_SHARDED      AISRV assignment mode (default: 1)
#   KAIWU_BENCHMARK_SHARD_COUNT  AISRV count (default: 2)
#   KAIWU_BENCHMARK_WORKERS_PER_AISRV  env/gamecore workers per AISRV (default: 4)
#   KAIWU_BENCHMARK_PARALLEL_MODE dynamic task queue mode (default: 1)

version: '3.8'

services:
  learner:
    restart: "no"
    environment:
      KAIWU_BENCHMARK_MODE: "1"
      KAIWU_BENCHMARK_PARALLEL_MODE: ${KAIWU_BENCHMARK_PARALLEL_MODE:-1}
      KAIWU_BENCHMARK_SCHEDULER: ${KAIWU_BENCHMARK_SCHEDULER:-dynamic}
      KAIWU_BENCHMARK_WORKER_COUNT: ${KAIWU_BENCHMARK_WORKER_COUNT:-2}
      KAIWU_BENCHMARK_ENVS_PER_WORKER: ${KAIWU_BENCHMARK_ENVS_PER_WORKER:-4}
      KAIWU_BENCHMARK_RUNTIME_DIR: ${KAIWU_BENCHMARK_RUNTIME_DIR:-/workspace/code/holdout_shards/dynamic}
      KAIWU_BENCHMARK_MAPS: ${KAIWU_BENCHMARK_MAPS:-4,7}
      KAIWU_BENCHMARK_EPISODES_PER_MAP: ${KAIWU_BENCHMARK_EPISODES_PER_MAP:-4}
      KAIWU_BENCHMARK_CHECKPOINT: ${KAIWU_BENCHMARK_CHECKPOINT:-model.ckpt-resume.pkl}

  aisrv:
    restart: "no"
    environment:
      KAIWU_BENCHMARK_MODE: "1"
      KAIWU_BENCHMARK_PARALLEL_MODE: ${KAIWU_BENCHMARK_PARALLEL_MODE:-1}
      KAIWU_BENCHMARK_SCHEDULER: ${KAIWU_BENCHMARK_SCHEDULER:-dynamic}
      KAIWU_BENCHMARK_WORKER_COUNT: ${KAIWU_BENCHMARK_WORKER_COUNT:-2}
      KAIWU_BENCHMARK_ENVS_PER_WORKER: ${KAIWU_BENCHMARK_ENVS_PER_WORKER:-4}
      KAIWU_BENCHMARK_RUNTIME_DIR: ${KAIWU_BENCHMARK_RUNTIME_DIR:-/workspace/code/holdout_shards/dynamic}
      KAIWU_BENCHMARK_MAPS: ${KAIWU_BENCHMARK_MAPS:-4,7}
      KAIWU_BENCHMARK_EPISODES_PER_MAP: ${KAIWU_BENCHMARK_EPISODES_PER_MAP:-4}
      KAIWU_BENCHMARK_CHECKPOINT: ${KAIWU_BENCHMARK_CHECKPOINT:-model.ckpt-resume.pkl}
      KAIWU_BENCHMARK_SHARDED: ${KAIWU_BENCHMARK_SHARDED:-1}
      KAIWU_BENCHMARK_SHARD_COUNT: ${KAIWU_BENCHMARK_SHARD_COUNT:-2}
      KAIWU_BENCHMARK_WORKERS_PER_AISRV: ${KAIWU_BENCHMARK_WORKERS_PER_AISRV:-4}

  gamecore:
    restart: "no"

  pushgateway:
    restart: "no"

  backup_model:
    restart: "no"
